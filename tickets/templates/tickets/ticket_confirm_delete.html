{% extends 'base.html' %}

{% block title %}Delete ticket{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle text-danger fs-1" aria-hidden="true"></i>
        <h1 class="h4 text-danger my-3">Delete this ticket?</h1>
        <p>
          You are about to delete
          <strong>"{{ ticket.issue_subject }}"</strong> and all of its replies.
        </p>
        <p class="text-muted small">This can't be undone.</p>
        <form method="post" class="mt-4 d-flex justify-content-center gap-2">
          {% csrf_token %}
          <a href="{% url 'ticket_detail' ticket.pk %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">Yes, delete it</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
